# =============================================================================
# 1. YOUR PERSONAL & SITE PROFILE (CUSTOMIZE THIS SECTION)
# =============================================================================

first_name: Chuxuan
middle_name: "Lexi"
last_name: Li
title: blank # website title (leave "blank" to automatically use your full name)

contact_note: >
  Email: lexi.li@pennmedicine.upenn.edu

description: >
  AI for Science | Computational biology | AI for health | Digital Pathology | PhD candidate at University of Pennsylvania

footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.

keywords: AI for science, computational biology, digital pathology, machine learning
lang: en
icon: 🌌

# --- URL & PATH SETTINGS ---
# If your repo is named "chuxuanlexili":
url: "https://l-cli.github.io"
baseurl: "/chuxuanlexili"

# NOTE: If you renamed your repo to "l-cli.github.io", change the lines above to:
# url: "https://l-cli.github.io"
# baseurl: ""

last_updated: true
back_to_top: true

# --- SOCIAL & ACADEMIC LINKS ---
# Add your profile IDs below (comment out or leave blank if not used)
socials:
  email: lexi.li@pennmedicine.upenn.edu
  github_username: l-cli
  linkedin_username: chuxuan-li  # e.g., chuxuan-li
  
# =============================================================================
# 2. SCHOLAR & PUBLICATION SETTINGS
# =============================================================================

scholar:
  last_name: [Li]
  first_name: [Chuxuan, Lexi, C., L.]

  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: true

filtered_bibtex_keywords:
  [abbr, abstract, additional_info, altmetric, annotation, arxiv, award, award_name,
   bibtex_show, blog, code, dimensions, eprint, google_scholar_id, hal, html,
   inspirehep_id, pdf, pmid, poster, preview, selected, slides, supp, video, website]

max_author_limit: 4
more_authors_animation_delay: 10
enable_publication_thumbnails: true

# =============================================================================
# 3. SITE NAVIGATION & FEATURES
# =============================================================================

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true
max_width: 930px

enable_darkmode: true
enable_math: true
enable_masonry: true
enable_medium_zoom: true
enable_progressbar: true

# =============================================================================
# 4. SYSTEM & THEME CONFIGURATION (NO NEED TO EDIT BELOW)
# =============================================================================

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: true
    distill:
      enabled: true

collections:
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"

include: ["_pages"]
exclude:
  - Dockerfile
  - docker-compose.yml
  - docs/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter
  - al_email_protect
  - al_marimo
  - al_rtl

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude: ["robots.txt"]

terser:
  compress:
    drop_console: true

imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories: ["assets/img/"]
  input_formats: [".jpg", ".jpeg", ".png"]
  output_formats:
    webp: "-auto-orient -quality 85"
lazy_loading_images: true

third_party_libraries:
  download: false
  fontawesome:
    integrity:
      css: "sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c="
    url:
      css: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css"
    version: "7.2.0"
  academicons:
    integrity:
      css: "sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw="
    url:
      css: "https://cdn.jsdelivr.net/npm/academicons@{{version}}/css/academicons.min.css"
    version: "1.9.5"
  jquery:
    integrity:
      js: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    url:
      js: "https://cdn.jsdelivr.net/npm/jquery@{{version}}/dist/jquery.min.js"
    version: "3.6.0"
  mathjax:
    integrity:
      js: "sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI="
    url:
      fonts: "https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/output/chtml/fonts/woff-v2/"
      js: "https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/tex-mml-chtml.js"
    version: "3.2.2"
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
